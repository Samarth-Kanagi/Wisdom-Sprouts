<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      list-style: none;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: rgb(28, 0, 128);
    }

    header {
      background: linear-gradient(to left, rgb(62, 36, 228), rgb(6, 19, 136));
      padding: 15px 0;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #logo {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .nav-links li {
      display: inline-block;
      margin-left: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border: 2px solid white;
      border-radius: 10px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      background: white;
      color: rgb(28, 0, 128);
    }

    .hero {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .hero-text p {
      font-size: 1rem;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 20px;
    }

    .buttons button {
      padding: 10px 24px;
      margin-right: 10px;
      border: 2px solid rgb(28, 0, 128);
      background: transparent;
      color: rgb(28, 0, 128);
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons button:hover {
      background: rgb(28, 0, 128);
      color: white;
    }

    .hero img {
      width: 300px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-10px); }
    }

    .contact {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      border: 2px solid rgb(28, 0, 128);
      border-radius: 16px;
    }

    .contact h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .contact input,
    .contact textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid rgb(28, 0, 128);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    .contact textarea {
      resize: none;
      height: 100px;
    }

    .contact button {
      width: 100%;
      padding: 10px;
      border: none;
      background: rgb(28, 0, 128);
      color: white;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      background: rgb(28, 0, 128);
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 60px;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div id="logo">LOGO</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </div>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Welcome to My Portfolio</h1>
    <p>
      This is my first portfolio. I am currently learning Full Stack Development
      and building simple projects to improve my skills.
    </p>
    <div class="buttons">
      <button>Resume</button>
      <button>Projects</button>
    </div>
  </div>

  <img src="img.jpg" alt="Profile Image" />
</section>

<section class="contact">
  <h2>Contact Me</h2>
  <form>
    <input type="text" placeholder="Name" required />
    <input type="email" placeholder="Email" required />
    <textarea placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer>
  <p>Samarth Kanagi</p>
</footer>

</body>
</html>
